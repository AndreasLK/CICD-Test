name: CICD - CI


on:
  workflow_dispatch:
  push:
    branches:
      - ["master"]
  pull_request:
    branches:
      - ["master"]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "CICD-Template.slnx"

jobs:
  name: Build and Test
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

  - name: Restore dependencies
    run: dotnet restore ${{ env.SOLUTION_PATH }}

  - name: Build
    run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release


  - name: Test
    run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --no-restore --configuration Release --verbosity normal

